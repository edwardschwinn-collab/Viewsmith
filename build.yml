# ============================================================================
# GitHub Actions workflow: builds the APK on GitHub's servers.
# Runs automatically on every push to "main", or manually from the Actions
# tab ("Run workflow" button). The finished APK shows up at the bottom of
# the run's summary page under "Artifacts".
# ============================================================================
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Grab the code from this repo
      - uses: actions/checkout@v4

      # 2. Install Java 17 (the Android build tools need it)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Make sure the Android SDK is ready
      - uses: android-actions/setup-android@v3

      # 4. Install Gradle (the build tool)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 5. Build the APK
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # 6. Save the APK so you can download it
      - uses: actions/upload-artifact@v4
        with:
          name: PencilCam-apk
          path: app/build/outputs/apk/debug/*.apk
