<svg xmlns="http://www.w3.org/2000/svg" viewBox="-100 -81 1224 1224" width="100%" height="100%">
  <!-- ViewSmith icon concept. ONE light source, straight above:
       highlights on top, shadows below, silver bright-top to dark-bottom. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2E34"/><stop offset="1" stop-color="#08090B"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F8FA"/><stop offset="0.25" stop-color="#D3D8DE"/>
      <stop offset="0.55" stop-color="#9AA1AA"/><stop offset="0.85" stop-color="#5C626A"/>
      <stop offset="1" stop-color="#D3D8DE"/>
    </linearGradient>
    <linearGradient id="glassBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3F46"/><stop offset="0.5" stop-color="#15171A"/><stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lensGlass" cx="0.5" cy="0.62" r="0.62">
      <stop offset="0" stop-color="#2C3036"/><stop offset="1" stop-color="#030304"/>
    </radialGradient>
    <radialGradient id="sclera" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#F4F5F6"/><stop offset="0.7" stop-color="#C9CED4"/><stop offset="1" stop-color="#7E858E"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0B0C0E"/><stop offset="0.38" stop-color="#2E4A66"/>
      <stop offset="0.75" stop-color="#4F7FA8"/><stop offset="1" stop-color="#16222E"/>
    </radialGradient>
    <clipPath id="eyeClip">
      <path d="M352 560 Q512 400 672 560 Q512 720 352 560 Z"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>


  <!-- Camera body: black glass with silver rim -->
  <g filter="url(#shadow)">
    <!-- top plate / viewfinder hump -->
    <path d="M392 262 h240 l34 70 H358 Z" fill="url(#silver)"/>
    <!-- shutter button -->
    <rect x="690" y="292" width="88" height="40" rx="12" fill="url(#silver)"/>
    <rect x="172" y="320" width="680" height="480" rx="86" fill="url(#glassBody)" stroke="url(#silver)" stroke-width="10"/>
  </g>
  <!-- glass sheen on upper body -->
  <rect x="186" y="334" width="652" height="150" rx="74" fill="url(#sheen)"/>
  <!-- little flash window -->
  <rect x="236" y="380" width="70" height="44" rx="10" fill="#0A0B0D" stroke="url(#silver)" stroke-width="5"/>

  <!-- Lens: silver knurled bezel like the app's dial -->
  <g filter="url(#shadow)">
    <circle cx="512" cy="560" r="214" fill="url(#silver)"/>
  </g>
  <g stroke="#3C4148" stroke-width="5" stroke-linecap="round" opacity="0.55">
    <!-- knurling ticks, drawn by rotating one tick -->
    <g id="tick"><line x1="512" y1="352" x2="512" y2="370"/></g>
    <use href="#tick" transform="rotate(10 512 560)"/><use href="#tick" transform="rotate(20 512 560)"/>
    <use href="#tick" transform="rotate(30 512 560)"/><use href="#tick" transform="rotate(40 512 560)"/>
    <use href="#tick" transform="rotate(50 512 560)"/><use href="#tick" transform="rotate(60 512 560)"/>
    <use href="#tick" transform="rotate(70 512 560)"/><use href="#tick" transform="rotate(80 512 560)"/>
    <use href="#tick" transform="rotate(90 512 560)"/><use href="#tick" transform="rotate(100 512 560)"/>
    <use href="#tick" transform="rotate(110 512 560)"/><use href="#tick" transform="rotate(120 512 560)"/>
    <use href="#tick" transform="rotate(130 512 560)"/><use href="#tick" transform="rotate(140 512 560)"/>
    <use href="#tick" transform="rotate(150 512 560)"/><use href="#tick" transform="rotate(160 512 560)"/>
    <use href="#tick" transform="rotate(170 512 560)"/><use href="#tick" transform="rotate(180 512 560)"/>
    <use href="#tick" transform="rotate(190 512 560)"/><use href="#tick" transform="rotate(200 512 560)"/>
    <use href="#tick" transform="rotate(210 512 560)"/><use href="#tick" transform="rotate(220 512 560)"/>
    <use href="#tick" transform="rotate(230 512 560)"/><use href="#tick" transform="rotate(240 512 560)"/>
    <use href="#tick" transform="rotate(250 512 560)"/><use href="#tick" transform="rotate(260 512 560)"/>
    <use href="#tick" transform="rotate(270 512 560)"/><use href="#tick" transform="rotate(280 512 560)"/>
    <use href="#tick" transform="rotate(290 512 560)"/><use href="#tick" transform="rotate(300 512 560)"/>
    <use href="#tick" transform="rotate(310 512 560)"/><use href="#tick" transform="rotate(320 512 560)"/>
    <use href="#tick" transform="rotate(330 512 560)"/><use href="#tick" transform="rotate(340 512 560)"/>
    <use href="#tick" transform="rotate(350 512 560)"/>
  </g>
  <!-- inner black glass -->
  <circle cx="512" cy="560" r="176" fill="url(#lensGlass)" stroke="#1A1C20" stroke-width="6"/>

  <!-- The eye -->
  <path d="M352 560 Q512 400 672 560 Q512 720 352 560 Z" fill="url(#sclera)"/>
  <g clip-path="url(#eyeClip)">
    <circle cx="512" cy="560" r="78" fill="url(#iris)"/>
    <!-- iris streaks -->
    <g stroke="#9CC0DE" stroke-width="3" opacity="0.35">
      <line x1="512" y1="500" x2="512" y2="484"/><line x1="554" y1="518" x2="566" y2="506"/>
      <line x1="572" y1="560" x2="588" y2="560"/><line x1="554" y1="602" x2="566" y2="614"/>
      <line x1="512" y1="620" x2="512" y2="636"/><line x1="470" y1="602" x2="458" y2="614"/>
      <line x1="452" y1="560" x2="436" y2="560"/><line x1="470" y1="518" x2="458" y2="506"/>
    </g>
    <circle cx="512" cy="560" r="32" fill="#020203"/>
    <!-- upper lid shadow: light is above, so the lid shades the top of the eye -->
    <path d="M352 560 Q512 400 672 560 Q512 470 352 560 Z" fill="#000" opacity="0.35"/>
  </g>
  <path d="M352 560 Q512 400 672 560 Q512 720 352 560 Z" fill="none" stroke="#0A0B0D" stroke-width="7"/>
  <!-- catchlight at the top of the pupil, from the overhead light -->
  <ellipse cx="530" cy="534" rx="16" ry="11" fill="#FFFFFF" opacity="0.92"/>

  <!-- Lens glass sheen across the top of the lens -->
  <ellipse cx="512" cy="448" rx="128" ry="52" fill="url(#sheen)"/>
</svg>
