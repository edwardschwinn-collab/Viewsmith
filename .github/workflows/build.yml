# ============================================================================
# GitHub Actions: builds the ViewSmith APK on GitHub's servers.
# Runs on every push to main. It can also be started by hand from the
# Actions tab ("Run workflow") on any branch, to test a change before it
# goes to main. The APK shows up under the run's Artifacts as ViewSmith-apk.
# ============================================================================
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Grab the code
      - uses: actions/checkout@v4

      # 2. Install Java 17
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Gradle (GitHub's machines already have the Android SDK)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 4. Build the APK
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # 5. Keep the APK so it can be downloaded
      - uses: actions/upload-artifact@v4
        with:
          name: ViewSmith-apk
          path: app/build/outputs/apk/debug/*.apk
